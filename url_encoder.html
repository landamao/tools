<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中文URL编码转换</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0f172a;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans SC',sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:min(900px,100%);background:rgba(30,41,59,.78);border:1px solid rgba(148,163,184,.14);border-radius:20px;padding:28px;box-shadow:0 18px 44px rgba(0,0,0,.28)}h1{margin:0 0 8px;font-size:28px;background:linear-gradient(135deg,#60a5fa,#a78bfa,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.tip{color:#94a3b8;margin:0 0 22px}textarea{width:100%;height:180px;background:#111827;color:#e5e7eb;border:1px solid #334155;border-radius:14px;padding:14px;font-size:15px;line-height:1.6;resize:vertical}textarea:focus{outline:none;border-color:#60a5fa;box-shadow:0 0 0 3px rgba(96,165,250,.15)}.buttons{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0}button,a{border:0;border-radius:12px;padding:11px 16px;background:rgba(96,165,250,.16);color:#bfdbfe;text-decoration:none;cursor:pointer;font-size:14px}button:hover,a:hover{background:rgba(96,165,250,.28)}.out{margin-top:18px}.label{margin:0 0 8px;color:#cbd5e1;font-weight:600}.copy{background:rgba(167,139,250,.18);color:#ddd6fe}.clear{background:rgba(244,114,182,.14);color:#fbcfe8}</style>
</head>
<body>
<div class="card">
  <h1>中文URL编码转换</h1>
  <p class="tip">把 URL 里的中文转成 %XX 编码，或把编码反向解码回来。</p>
  <p class="label">输入</p>
  <textarea id="input" placeholder="例如：http://82.157.178.5:9520/懒大猫的主页.html"></textarea>
  <div class="buttons">
    <button onclick="encodeUrl()">编码中文</button>
    <button onclick="decodeUrl()">解码URL</button>
    <button class="copy" onclick="copyOutput()">复制结果</button>
    <button class="clear" onclick="clearAll()">清空</button>
    <a href="/">返回工具箱</a>
  </div>
  <div class="out">
    <p class="label">结果</p>
    <textarea id="output" readonly></textarea>
  </div>
</div>
<script>
const input=document.getElementById('input'), output=document.getElementById('output');
function encodeUrl(){try{output.value=encodeURI(input.value)}catch(e){output.value='编码失败：'+e.message}}
function decodeUrl(){try{output.value=decodeURI(input.value)}catch(e){output.value='解码失败：'+e.message}}
async function copyOutput(){if(!output.value)return; await navigator.clipboard.writeText(output.value)}
function clearAll(){input.value='';output.value='';input.focus()}
</script>
</body>
</html>
