<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>字典层级格式化工具</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%230b1020'/%3E%3Cpath d='M14 18c15 0 11 14 31 14' stroke='%237dd3fc' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3Cpath d='M22 39h22M30 49h12' stroke='%23a7f3d0' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='49' cy='17' r='5' fill='%23facc15'/%3E%3C/svg%3E">
<style>
:root{--bg:#0b1020;--card:rgba(15,23,42,.86);--line:rgba(148,163,184,.24);--text:#e5e7eb;--muted:#94a3b8;--a:#7dd3fc;--b:#a7f3d0;--r:#fb7185;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 12%,rgba(125,211,252,.2),transparent 35%),radial-gradient(circle at 90% 20%,rgba(167,243,208,.14),transparent 35%),var(--bg);color:var(--text);font-family:var(--sans)}main{max-width:1180px;margin:auto;padding:32px 16px}.hero{display:flex;gap:16px;align-items:center;margin-bottom:20px}.logo{width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,var(--a),var(--b));transform:rotate(-5deg);box-shadow:0 18px 50px #0008;position:relative}.logo:before{content:"";position:absolute;left:12px;top:15px;width:34px;height:6px;border-radius:9px;background:#07111f;transform:rotate(18deg)}.logo:after{content:"";position:absolute;right:9px;bottom:10px;width:12px;height:12px;border-radius:50%;background:#facc15}h1{margin:0;font-size:clamp(24px,4vw,38px)}.sub{color:var(--muted);margin-top:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:850px){.grid{grid-template-columns:1fr}}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 20px 70px #0007}.head{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);background:#0f172a99}.title{font-weight:800}.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.json-indent{display:inline-flex;gap:6px;align-items:center;color:var(--muted);font-size:13px}.json-indent input{width:64px;border:1px solid var(--line);border-radius:10px;padding:8px 9px;background:#02061799;color:var(--text);font:13px var(--mono)}button{border:0;border-radius:12px;padding:9px 12px;font-weight:800;cursor:pointer;background:var(--a);color:#07111f}button:hover{filter:brightness(1.05);transform:translateY(-1px)}button.gray{background:#334155;color:var(--text);border:1px solid var(--line)}button.green{background:var(--b)}textarea{width:100%;min-height:520px;resize:vertical;border:0;outline:0;padding:16px;background:#02061799;color:var(--text);font:14px/1.62 var(--mono)}.out{min-height:520px;max-height:75vh;overflow:auto;padding:16px;background:#02061777;font:14px/1.6 var(--mono)}.hint{padding:10px 16px 14px;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}.tabs{display:flex;gap:8px;padding:12px 16px 0;background:#02061744}.tab{background:transparent;color:var(--muted);border:1px solid var(--line)}.tab.on{background:var(--a);color:#07111f;border:0}.tree ul{margin:0 0 0 20px;padding:0 0 0 14px;border-left:1px dashed #94a3b852}.tree li{list-style:none;margin:3px 0;position:relative}.tree li:before{content:"";position:absolute;left:-15px;top:13px;width:10px;border-top:1px dashed #94a3b852}details{margin:2px 0}summary{cursor:pointer;color:var(--b)}.key{color:#93c5fd;font-weight:800}.idx{color:#c4b5fd;font-weight:800}.type{color:#64748b;font-size:12px}.str{color:#f9a8d4}.num{color:#fde68a}.bool{color:#86efac}.nil{color:#94a3b8;font-style:italic}.err{color:#fecdd3;white-space:pre-wrap}.status{display:inline-flex;align-items:center;gap:8px;color:var(--muted)}.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);box-shadow:0 0 0 4px #94a3b820}.ok .dot{background:#34d399}.bad .dot{background:var(--r)}pre{margin:0;white-space:pre-wrap;word-break:break-word}
/* theme toggle button */
#theme-toggle{position:fixed;top:16px;right:16px;z-index:9999;width:40px;height:40px;border:none;border-radius:50%;background:rgba(255,255,255,.12);color:inherit;font-size:20px;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center}
#theme-toggle:hover{background:rgba(255,255,255,.22)}
/* light pink theme overrides */
body.light-theme{--bg:#fce7f3;--card:#fff0f6;--line:#f9a8d4;--text:#831843;--muted:#be185d;--a:#ec4899;--b:#ec4899;--r:#be123c}
body.light-theme{background:radial-gradient(circle at 12% 12%,rgba(236,72,153,.18),transparent 35%),radial-gradient(circle at 90% 20%,rgba(249,168,212,.22),transparent 35%),#fce7f3!important}
body.light-theme .head{background:#fbcfe84d!important;border-bottom-color:#f9a8d4!important}
body.light-theme .json-indent input,body.light-theme textarea{background:#ffffff!important;border:1px solid #f9a8d4!important;color:#831843!important}
body.light-theme .out{background:#fff0f6!important}
body.light-theme .tabs{background:#fbcfe833!important}
body.light-theme button{color:#fff!important}
body.light-theme button.gray{background:#fbcfe8!important;color:#831843!important;border:1px solid #f9a8d4!important}
body.light-theme .tab.on{color:#fff!important}
body.light-theme .tree ul{border-left:1px dashed #f9a8d466!important}
body.light-theme .tree li:before{border-top:1px dashed #f9a8d466!important}
body.light-theme summary{color:#ec4899!important}
body.light-theme .key{color:#be185d!important}
body.light-theme .idx{color:#ec4899!important}
body.light-theme .type{color:#be185d!important}
body.light-theme .nil{color:#be185d!important;font-style:italic}
body.light-theme .str{color:#db2777!important}
body.light-theme .num{color:#9d174d!important}
body.light-theme .bool{color:#15803d!important}
body.light-theme .err{color:#be123c!important}
</style>
</head>
<body><button id="theme-toggle">🌙</button><main><div class="hero"><div class="logo"></div><div><h1>字典 → 层级格式化</h1><div class="sub">粘贴 Python 字典 / JSON，一键展开为层级树，也可复制标准 JSON。</div></div></div>
<section class="grid"><div class="card"><div class="head"><div class="title">输入</div><div class="btns"><button id="paste" class="green">粘贴</button><button id="fmt">格式化</button><button id="clear" class="gray">清空</button></div></div><textarea id="input" spellcheck="false" placeholder="把字典或 JSON 粘贴到这里：&#10;{'time': 1780753965, 'raw_info': [{'type': 'qq'}]}&#10;&#10;支持单引号、True/False/None、尾随逗号。"></textarea><div class="hint">快捷键：Ctrl / ⌘ + Enter 格式化。</div></div>
<div class="card"><div class="head"><div class="title">输出</div><div class="btns"><label class="json-indent">JSON缩进 <input id="indent" type="number" min="0" max="10" step="1" placeholder="2"></label><button id="copyTree" class="gray">复制层级文本</button><button id="copyJson" class="gray">复制 JSON</button></div></div><div class="tabs"><button class="tab on" data-tab="tree">层级树</button><button class="tab" data-tab="text">层级文本</button><button class="tab" data-tab="json">JSON</button></div><div id="out" class="out"><span class="status"><span class="dot"></span>等待输入，像小树苗等一场雨。</span></div><div class="hint" id="meta">未解析</div></div></section></main>
<script>
const $=s=>document.querySelector(s),input=$('#input'),out=$('#out'),meta=$('#meta'),indentInput=$('#indent');let data=null,ttext='',jtext='',tab='tree';
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function norm(s){return s.replace(/\bNone\b/g,'null').replace(/\bTrue\b/g,'true').replace(/\bFalse\b/g,'false').replace(/,\s*([}\]])/g,'$1')}
function parse(raw){let s=raw.trim();if(!s)throw Error('还没有输入内容。');try{return JSON.parse(s)}catch(e){}s=norm(s);try{return JSON.parse(s)}catch(e){}try{return Function('"use strict";return ('+s+')')()}catch(e){throw Error('解析失败：请确认内容是 Python 字典或 JSON。\n\n'+e.message)}}
function typ(v){return Array.isArray(v)?`array[${v.length}]`:v===null?'null':typeof v}
function val(v){if(typeof v==='string')return `<span class="str">"${esc(v)}"</span>`;if(typeof v==='number')return `<span class="num">${v}</span>`;if(typeof v==='boolean')return `<span class="bool">${v}</span>`;if(v===null)return '<span class="nil">null</span>';return esc(v)}
function html(v,label='root',idx=false){let cls=idx?'idx':'key';if(v&&typeof v==='object'){let arr=Array.isArray(v),es=arr?v.map((x,i)=>[i,x]):Object.entries(v);let ch=es.length?`<ul>${es.map(([k,x])=>`<li>${html(x,String(k),arr)}</li>`).join('')}</ul>`:'<ul><li><span class="nil">空</span></li></ul>';return `<details${label==='root'?' open':''}><summary><span class="${cls}">${esc(label)}</span> <span class="type">${typ(v)}</span></summary>${ch}</details>`}return `<span class="${cls}">${esc(label)}</span>: ${val(v)} <span class="type">${typ(v)}</span>`}
function text(v,label='root',dep=0,idx=false){let p='  '.repeat(dep),name=idx?`[${label}]`:label;if(v&&typeof v==='object'){let arr=Array.isArray(v),es=arr?v.map((x,i)=>[i,x]):Object.entries(v);let s=`${p}${name}: ${typ(v)}\n`;if(!es.length)return s+`${p}  (空)\n`;for(const [k,x] of es)s+=text(x,String(k),dep+1,arr);return s}return `${p}${name}: ${JSON.stringify(v)} (${typ(v)})\n`}
function count(v){if(!v||typeof v!=='object')return 1;return 1+(Array.isArray(v)?v:Object.values(v)).reduce((n,x)=>n+count(x),0)}
function render(){if(!data)return;if(tab==='tree')out.innerHTML=`<div class="tree">${html(data)}</div>`;if(tab==='text')out.innerHTML=`<pre>${esc(ttext)}</pre>`;if(tab==='json')out.innerHTML=`<pre>${esc(jtext)}</pre>`}
function getIndent(){let raw=indentInput.value.trim();if(raw==='')return 2;let n=Number(raw);if(!Number.isFinite(n)||n<0||n>10)throw Error('JSON 缩进只能填 0 到 10 的整数。');return Math.floor(n)}
function fmt(){try{data=parse(input.value);ttext=text(data).trimEnd();jtext=JSON.stringify(data,null,getIndent());render();meta.innerHTML=`<span class="status ok"><span class="dot"></span>解析成功：${count(data)} 个节点，JSON 缩进 ${getIndent()} 空格</span>`}catch(e){data=null;ttext=jtext='';out.innerHTML=`<div class="err">${esc(e.message)}</div>`;meta.innerHTML=`<span class="status bad"><span class="dot"></span>解析失败</span>`}}
async function copy(s){if(!s)return;try{await navigator.clipboard.writeText(s)}catch(e){let t=document.createElement('textarea');t.value=s;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}}
$('#fmt').onclick=fmt;indentInput.addEventListener('input',()=>{if(data)fmt()});$('#clear').onclick=()=>{input.value='';data=null;ttext=jtext='';out.innerHTML='<span class="status"><span class="dot"></span>等待输入，像小树苗等一场雨。</span>';meta.textContent='未解析'};$('#paste').onclick=async()=>{try{input.value=await navigator.clipboard.readText();fmt()}catch(e){out.innerHTML=`<div class="err">无法读取剪贴板：${esc(e.message)}\n请手动粘贴。</div>`}};$('#copyTree').onclick=()=>copy(ttext);$('#copyJson').onclick=()=>copy(jtext);document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');tab=b.dataset.tab;render()});input.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')fmt()});
</script>
<script>(function(){var b=document.getElementById('theme-toggle');var s=localStorage.getItem('theme')||'light';if(s==='light')document.body.classList.add('light-theme');b.textContent=s==='light'?'☀️':'🌙';b.addEventListener('click',function(){var l=document.body.classList.toggle('light-theme');localStorage.setItem('theme',l?'light':'dark');b.textContent=l?'☀️':'🌙'});})();</script>
</body></html>
